name: Cloud Run Preview Deploy

# Manual-only: trigger from the Actions tab (or `gh workflow run`) against
# whichever branch/ref you want previewed. Deploys a --no-traffic revision
# tagged "welcome-polish" so it never affects live traffic.
#
# Requires two repository secrets, both added under Settings > Secrets and
# variables > Actions > New repository secret. Neither is ever sent to, or
# visible to, any AI agent working in this repo — only GitHub's runner reads
# them.
#   - GCP_SA_KEY: a GCP service account JSON key with these roles on the
#     kanji-densha-jp project:
#       - Cloud Run Admin
#       - Artifact Registry Administrator
#       - Cloud Build Editor
#       - Service Account User
#       - Storage Admin
#   - DATABASE_URL: the Neon connection string for the target database.
#     Migrated here (see "Run database migrations" below) and passed to the
#     deployed revision via --set-env-vars, so the container reads the same
#     database this workflow just migrated. NOTE: --set-env-vars stores the
#     value in the Cloud Run revision's own metadata, readable by anyone with
#     viewer access on the project — acceptable for now, but Secret Manager
#     (--set-secrets) is the stricter option if that project ever has more
#     than a couple of trusted viewers.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Cloud Run service name"
        required: false
        default: "dynamic-densha-web"

env:
  PROJECT_ID: kanji-densha-jp
  REGION: asia-northeast1
  TAG: welcome-polish

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies (needed to run the migration script)
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        # Deliberately before the deploy steps below: the deployed revision
        # must never serve traffic against an unmigrated schema. migrate.mjs
        # fails loudly (non-zero exit) on any error or a missing
        # DATABASE_URL, which stops this job before it reaches "Deploy".
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @kanji-densha/web db:migrate

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Enable required APIs
        run: |
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com cloudbuild.googleapis.com --project "$PROJECT_ID"

      - name: Create service if it doesn't exist yet
        # Cloud Run rejects --no-traffic on a brand-new service's very first
        # revision (nothing prior to keep serving), so create it normally
        # first if needed; that first revision gets 100% traffic since it's
        # the only one.
        env:
          SERVICE: ${{ inputs.service_name }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if ! gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud run deploy "$SERVICE" \
              --source . \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --set-env-vars "DATABASE_URL=$DATABASE_URL" \
              --allow-unauthenticated
          fi

      - name: Show latest Cloud Build log on failure
        if: failure()
        run: |
          BUILD_ID=$(gcloud builds list --project "$PROJECT_ID" --region "$REGION" --limit=1 --sort-by=~createTime --format='value(id)')
          echo "Latest build: $BUILD_ID"
          gcloud builds log "$BUILD_ID" --project "$PROJECT_ID" --region "$REGION" || true

      - name: Deploy welcome-polish tagged revision at 0% traffic
        env:
          SERVICE: ${{ inputs.service_name }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --no-traffic \
            --tag "$TAG" \
            --set-env-vars "DATABASE_URL=$DATABASE_URL" \
            --allow-unauthenticated

      - name: Print preview URL
        env:
          SERVICE: ${{ inputs.service_name }}
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --format="value(status.traffic[?tag='$TAG'].url)")
          echo "### Cloud Run preview URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "PREVIEW_URL=$URL"
